[project]
name = "cortex-nexus-api"
version = "0.1.0"
description = "Cortex Nexus v0.1: canonical procurement data foundation (API service)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# openpyxl ships without type information.
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs the dedicated PostgreSQL test database (TEST_DATABASE_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
