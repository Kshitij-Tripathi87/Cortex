name: Cortex Nexus — E2E Release Acceptance (Pipeline 3)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-playwright:
    name: Full-Stack E2E Operational Journey
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start Production Stack (Postgres, Redis, Kafka, MinIO)
        run: |
          docker compose -f docker-compose.prod.yml up -d postgres redis minio
          docker compose -f docker-compose.prod.yml ps

      - name: Install Backend & Run Migrations
        run: |
          cd backend
          pip install -e ".[dev]"
          alembic upgrade head

      - name: Run Backend Services in Background
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/api/v1/health || exit 1

      - name: Install Frontend & Playwright Browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Full-Journey E2E Tests
        run: |
          cd frontend
          npx playwright test tests/e2e_release_acceptance.spec.ts

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
