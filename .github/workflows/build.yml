name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GHCR promotion: main pushes publish digest-pinned images whose registry
# digests become the values pinned into Workflo RunnerProfiles and injected
# as CORTEX_RUNNER_IMAGE_DIGEST at deploy time (fail-closed identity check).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  docker-backend:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push-backend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record backend registry digest
        run: |
          DIGEST="${{ steps.push-backend.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "backend digest: not pushed on PRs (build-only)"
          else
            echo "backend registry digest: $DIGEST"
            echo "### Backend image promotion" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ env.IMAGE_PREFIX }}/backend@${DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "Pin this digest into the Workflo RunnerProfile and set" >> $GITHUB_STEP_SUMMARY
            echo "\`CORTEX_RUNNER_IMAGE_DIGEST=$DIGEST\` at deploy time." >> $GITHUB_STEP_SUMMARY
          fi

  docker-frontend:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record frontend registry digest
        run: |
          DIGEST="${{ steps.push-frontend.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "frontend digest: not pushed on PRs (build-only)"
          else
            echo "frontend registry digest: $DIGEST"
            echo "### Frontend image promotion" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ env.IMAGE_PREFIX }}/frontend@${DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config