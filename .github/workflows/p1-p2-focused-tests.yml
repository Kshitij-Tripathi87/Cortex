name: Priority 1-2 Focused Tests

on:
  push:
    branches:
      - codex/priority-1-2-foundation-2026-11-04
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/app/modules/ingestion/**"
      - "backend/app/modules/supply_chain/planning.py"
      - "backend/tests/test_ingestion_parsing.py"
      - "backend/tests/test_ingestion_transactions.py"
      - "backend/tests/test_material_planning.py"
      - "backend/alembic/versions/017_ingestion_file_digest.py"
      - "backend/pyproject.toml"
      - ".github/workflows/p1-p2-focused-tests.yml"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CORTEX_ENV: test
      CORTEX_DB_DSN: sqlite+aiosqlite:///:memory:
      CORTEX_TEST_DATABASE_URL: sqlite+aiosqlite:///:memory:
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and development dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      - name: Run Priority 1 and 2 focused tests
        run: |
          source .venv/bin/activate
          # Avoid the repository-wide tests/conftest.py: on this remote base it
          # imports the deleted root product/ package and is unrelated to these
          # pure/unit tests. These tests create their own SQLite fixture.
          ruff check \
            app/modules/supply_chain/planning.py \
            app/modules/ingestion/service.py \
            app/modules/ingestion/models.py \
            app/api/v1/ingestion.py \
            tests/test_material_planning.py \
            tests/test_ingestion_parsing.py \
            tests/test_ingestion_transactions.py
          ruff format --check \
            app/modules/supply_chain/planning.py \
            app/modules/ingestion/service.py \
            app/modules/ingestion/models.py \
            app/api/v1/ingestion.py \
            tests/test_material_planning.py \
            tests/test_ingestion_parsing.py \
            tests/test_ingestion_transactions.py
          pytest --confcutdir=app \
            tests/test_ingestion_parsing.py \
            tests/test_ingestion_transactions.py \
            tests/test_material_planning.py \
            -q --tb=short
