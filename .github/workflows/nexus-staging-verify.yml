name: Nexus staging verify

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/staging/**'
      - '.github/workflows/nexus-staging-verify.yml'
  push:
    branches:
      - 'arena/nexus-v0.8.5-productization'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/staging/**'
      - '.github/workflows/nexus-staging-verify.yml'

concurrency:
  group: nexus-staging-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-contract:
    name: Staging compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose interpolation
        working-directory: deploy/staging
        env:
          CORTEX_DB_DSN: postgresql+asyncpg://staging:staging@example.invalid:5432/cortex
          CORTEX_REDIS_URL: rediss://:staging@example.invalid:6379/0
          CORTEX_S3_ENDPOINT: https://s3.amazonaws.com
          CORTEX_S3_BUCKET: cortex-nexus-staging
          CORTEX_S3_ACCESS_KEY: contract-test
          CORTEX_S3_SECRET_KEY: contract-test
          CORTEX_JWT_SECRET: contract-test-only
          NEXT_PUBLIC_API_URL: https://api.staging.example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.staging.example.com/api/v1
        run: docker compose config --quiet

      - name: Assert no Kafka dependency in staging
        working-directory: deploy/staging
        env:
          CORTEX_DB_DSN: postgresql+asyncpg://staging:staging@example.invalid:5432/cortex
          CORTEX_REDIS_URL: rediss://:staging@example.invalid:6379/0
          CORTEX_S3_ENDPOINT: https://s3.amazonaws.com
          CORTEX_S3_BUCKET: cortex-nexus-staging
          CORTEX_S3_ACCESS_KEY: contract-test
          CORTEX_S3_SECRET_KEY: contract-test
          CORTEX_JWT_SECRET: contract-test-only
          NEXT_PUBLIC_API_URL: https://api.staging.example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.staging.example.com/api/v1
        run: |
          ! docker compose config | grep -qi kafka

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[dev]'
      - name: Run backend tests
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=/tmp/pytest.xml 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-backend-test-diagnostics
          path: |
            /tmp/pytest.log
            /tmp/pytest.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.staging.example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.staging.example.com/api/v1
