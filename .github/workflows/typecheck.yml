name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -e ".[dev]"

      - name: Run MyPy
        working-directory: ./backend
        run: mypy app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run frontend unit tests (vitest)
        working-directory: ./frontend
        run: npm test
  openapi-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install generators
        run: |
          cd backend && pip install -e ".[dev]"
          cd ../frontend && npm ci
      - name: Generate and verify OpenAPI types
        run: |
          # The generator runs in backend/; the comparison runs from the
          # repository root, where the paths below exist. It used to run in
          # backend/ as well, matched no file and could not fail, so the
          # committed types drifted from the API without anyone being told.
          (cd backend && python -m scripts.generate_types)
          files="backend/openapi.json frontend/src/types/openapi.json frontend/src/types/api.ts"
          for file in $files; do
            test -f "$file" || { echo "::error::$file is missing: the comparison would pass on nothing"; exit 1; }
          done
          if ! git diff --exit-code --stat -- $files; then
            # The first changed lines go into the annotation, so the cause is
            # readable on the pull request without opening the log.
            changed=$(git diff --unified=0 -- $files | grep -E '^[+-][^+-]' | head -20 | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            echo "::error title=Generated API types are out of date::Run 'python -m scripts.generate_types' in backend/ and commit the three files.%0A${changed}"
            exit 1
          fi
