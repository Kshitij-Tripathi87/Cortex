name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -e ".[dev]"

      - name: Run MyPy
        working-directory: ./backend
        run: mypy app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run frontend unit tests (vitest)
        working-directory: ./frontend
        run: npm test
  openapi-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install generators
        run: |
          cd backend && pip install -e ".[dev]"
          cd ../frontend && npm ci
      - name: Generate and verify OpenAPI types
        run: |
          cd backend && python -m scripts.generate_types
          git diff --exit-code -- backend/openapi.json frontend/src/types/openapi.json frontend/src/types/api.ts