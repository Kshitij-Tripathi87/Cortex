name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.80.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --no-verification

  dependencies:
    # The same gates as the `security` job of ci.yml. They run here once a
    # week as well, so an advisory published against an unchanged lockfile is
    # noticed without waiting for the next commit. Both steps used to end in
    # `|| true` and could not fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        working-directory: ./backend
        run: |
          # The project's own dependency closure in a fresh environment, not
          # whatever the runner happens to have installed.
          python -m venv /tmp/auditenv
          /tmp/auditenv/bin/pip install --quiet pip-audit
          /tmp/auditenv/bin/pip install --quiet -e .
          /tmp/auditenv/bin/pip freeze --all \
            | grep -v '^-e' | grep -v '^pip==' | grep -v '^setuptools==' | grep -v '^wheel==' \
            > /tmp/audit-reqs.txt
          /tmp/auditenv/bin/pip-audit --no-deps --desc \
            --requirement /tmp/audit-reqs.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: ./frontend
        run: |
          npm ci
          # Production dependencies: any high or critical advisory fails.
          node scripts/audit-gate.mjs
          # Build, lint and test tools: any critical advisory fails, the rest
          # is reported. See scripts/audit-gate.mjs.
          node scripts/audit-gate.mjs --tools
