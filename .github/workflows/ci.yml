name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CORTEX_ENV: test
  CORTEX_DB_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/cortex_test
  # Alembic env.py converts the asyncpg scheme to psycopg2; the pytest
  # conftest uses it as-is for the postgres_* fixtures.
  CORTEX_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cortex_test
  CORTEX_REDIS_URL: redis://localhost:6379/0
  CORTEX_S3_ENDPOINT: http://localhost:9000
  CORTEX_S3_BUCKET: cortex-uploads
  CORTEX_S3_ACCESS_KEY: minioadmin
  CORTEX_S3_SECRET_KEY: minioadmin

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      
      - name: Run Ruff
        run: |
          cd backend
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Forbid deferred imports in production paths
        run: |
          cd backend
          # pipefail-safe: an empty grep result is the PASSING case, so the
          # pipeline must not propagate grep's exit 1 to the shell (-e).
          if grep -rE 'from app\.deferred|import app\.deferred' app/ tests/ alembic/versions/ 2>/dev/null \
              | grep -vE '^app/deferred/|^tests/deferred/' | grep -q .; then
            echo "ERROR: app.deferred.* must not be imported in production paths (ADR-0007)"
            grep -rE 'from app\.deferred|import app\.deferred' app/ tests/ alembic/versions/ 2>/dev/null \
              | grep -vE '^app/deferred/|^tests/deferred/'
            exit 1
          fi

      - name: Run MyPy
        run: |
          cd backend
          source .venv/bin/activate
          mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000", "9001:9001"]
        command: server /data --console-address ":9001"
        options: --health-cmd "mc ready local" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      
      - name: Run Alembic migrations
        run: |
          cd backend
          source .venv/bin/activate
          alembic upgrade head
      
      - name: Run tests
        run: |
          cd backend
          source .venv/bin/activate
          set +e
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --junitxml=/tmp/junit.xml
          rc=$?
          set -e
          # Surface every failed test as a check-run annotation (job logs
          # are not retrievable in some environments).
          cat > /tmp/junit_annotate.py <<'PYEXTRACT'
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("/tmp/junit.xml").getroot()
          except Exception as e:
              print(f"::error title=pytest no-report::junitxml missing: {e}")
              raise SystemExit(0)
          counts = {}
          for tc in root.iter("testcase"):
              for kind in ("failure", "error"):
                  node = tc.find(kind)
                  if node is None:
                      continue
                  counts[kind] = counts.get(kind, 0) + 1
                  name = f"{tc.get('classname', '')}::{tc.get('name', '')}"
                  msg = (node.get("message") or node.text or kind)[:700].replace("\n", " | ")
                  print(f"::error title=pytest {kind}: {name}::{msg}")
          print(f"::notice title=pytest summary::failures={counts}")
          PYEXTRACT
          python /tmp/junit_annotate.py || true
          exit $rc
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          # Coverage upload is reporting, not gating: a tokenless/public-repo
          # upload hiccup must not fail the test job. (No CODECOV_TOKEN is
          # configured in this repository.)
          fail_ci_error: false

  budget-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      
      - name: Run budget checks
        run: |
          cd backend
          source .venv/bin/activate
          python scripts/check_budgets.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run TruffleHog (secrets scan)
        uses: trufflesecurity/trufflehog@v3.80.0
        with:
          path: .
          base: main
          head: HEAD
      
      - name: Run dependency audit (Python)
        run: |
          cd backend
          # Hermetic: audit the PROJECT's dependency closure in a fresh
          # venv — never the runner's system python (PEP 668 refusal) or
          # its preinstalled packages.
          python -m venv /tmp/auditenv
          /tmp/auditenv/bin/pip install --quiet pip-audit
          /tmp/auditenv/bin/pip install --quiet -e .
          /tmp/auditenv/bin/pip freeze --all \
            | grep -v '^-e' | grep -v '^pip==' | grep -v '^setuptools==' | grep -v '^wheel==' \
            > /tmp/audit-reqs.txt
          # PYSEC-2026-1325 (ecdsa, via python-jose — used for JWT
          # verification in app/modules/identity/provider.py) has no fix
          # release upstream. Ignored explicitly here; re-evaluate when
          # python-jose ships a fix or the identity module migrates to
          # PyJWT-only.
          /tmp/auditenv/bin/pip-audit --no-deps --desc \
            --requirement /tmp/audit-reqs.txt --ignore-vuln PYSEC-2026-1325
      
      - name: Run dependency audit (Node)
        run: |
          cd frontend
          npm ci
          # Audit gate with an explicit advisory ratchet: accepted
          # advisories (Next 14 line, fix = next 16 migration PR) are
          # documented in scripts/audit-gate.mjs; any NEW high/critical
          # production vulnerability fails. Also immune to the npm
          # registry advisory-endpoint flakiness that flipped this gate
          # red/green across identical commits.
          node scripts/audit-gate.mjse