# Clean-checkout verification, from an empty runner to the end-to-end proof.
# Every command is a Makefile target or a script of this repository, so CI and
# a developer run the same thing. Nothing here talks to a service outside the
# runner except the package index.
# Actions are pinned to commit SHAs, not tags; the `# vX` comment beside each
# pin names the tag the SHA was taken from. Dependabot
# (.github/dependabot.yml) proposes the moves.
name: CI

on:
  pull_request:
  push:
    branches: [main, "sprint/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit, so that every step runs with `-o pipefail`: a failing command
    # whose output is piped into `tee` must fail the step.
    shell: bash

env:
  # Output through `tee` stays in the order in which it was written.
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Clean checkout to end-to-end proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Local configuration from the template
        run: |
          cp .env.example .env
          mkdir -p artifacts/tmp

      - name: Install the locked dependencies
        run: |
          make setup
          # A lockfile that is out of date fails the install above; this fails
          # if the install changed it.
          git diff --exit-code -- services/api/uv.lock

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Unit tests (no database)
        run: make test-unit | tee artifacts/tmp/ci-test-unit.txt

      - name: Start PostgreSQL 16 with Docker Compose (development and test)
        run: |
          {
            make db-up
            docker compose -f infra/docker-compose.yml ps
            docker volume ls --filter name=nexus_pgdata
          } 2>&1 | tee artifacts/tmp/ci-db-up.txt

      - name: Migrate the empty development database
        run: |
          {
            make migrate
            make migration-check
          } 2>&1 | tee artifacts/tmp/ci-migrate.txt

      - name: API tests on the test database
        run: make test-api | tee artifacts/tmp/ci-test-api.txt

      - name: Integration tests on the test database
        run: make test-integration | tee artifacts/tmp/ci-test-integration.txt

      - name: OpenAPI document is up to date
        run: make openapi-check

      - name: End to end, with a restart of the API and of the database container
        # On the empty, migrated development database: creates the workspace,
        # uploads, previews and commits the demo dataset over HTTP, sends it
        # again, runs the seed on top, then removes and recreates the
        # PostgreSQL container (the named volume is kept) and checks that the
        # World State is identical each time.
        run: |
          cd services/api
          uv run python ../../scripts/verify_sprint.py --e2e-only \
            --evidence-dir ../../artifacts/tmp/e2e \
            --summary ../../artifacts/tmp/verify-e2e.json 2>&1 | tee ../../artifacts/tmp/ci-e2e.txt

      - name: Report the evidence
        if: always()
        run: |
          # Reporting never decides the result of the job.
          set +e +o pipefail
          annotate() {
            # One annotation per item, readable on the run page without the log.
            # A title must not contain a comma: it would end the title.
            local title="$1" body
            body=$(head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=${title}::${body}"
          }
          docker compose -f infra/docker-compose.yml ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' | annotate "docker compose ps" || true
          docker volume ls --filter name=nexus_pgdata --format '{{.Name}} ({{.Driver}})' | annotate "named volume" || true
          for level in unit api integration; do
            if [ -f "artifacts/tmp/ci-test-${level}.txt" ]; then
              tail -n 1 "artifacts/tmp/ci-test-${level}.txt" | annotate "tests ${level}"
            fi
          done
          if [ -f artifacts/tmp/e2e/day3-restart-proof.txt ]; then
            annotate "restart proof" < artifacts/tmp/e2e/day3-restart-proof.txt
          fi
          if [ -f artifacts/tmp/verify-e2e.json ]; then
            annotate "end-to-end summary" < artifacts/tmp/verify-e2e.json
          fi
          (cd services/api && uv run python --version) | annotate "python" || true

      - name: Explain a failure
        # The last lines of what each step printed, and of the database logs,
        # as annotations: readable without opening the log.
        if: failure()
        run: |
          set +e +o pipefail
          annotate() {
            local title="$1" body
            body=$(head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=${title}::${body}"
          }
          for file in artifacts/tmp/ci-*.txt; do
            if [ -f "$file" ]; then
              tail -n 30 "$file" | cut -c1-200 | annotate "last lines of $(basename "$file" .txt)"
            fi
          done
          docker compose -f infra/docker-compose.yml logs --tail 20 2>&1 | cut -c1-200 | annotate "docker compose logs"

      - name: Keep the evidence files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sprint-evidence
          path: artifacts/tmp/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop the databases (the volume is kept)
        if: always()
        run: make db-down

  defect-detection:
    # A test that cannot fail proves nothing. This job removes one guarded
    # behaviour at a time (a row lock, a workspace filter, a bound) and
    # expects the tests to fail each time. It edits files of its own checkout
    # only, and puts each one back.
    name: Tests fail when the behaviour is removed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
          # The other job saves this cache. Two jobs that save the same key at
          # the same moment leave a warning on the run.
          save-cache: false

      - name: Local configuration from the template
        run: |
          cp .env.example .env
          mkdir -p artifacts/tmp

      - name: Install the locked dependencies
        run: make setup

      - name: Start PostgreSQL 16 with Docker Compose
        run: make db-up 2>&1 | tee artifacts/tmp/ci-db-up.txt

      - name: Remove one behaviour at a time; a test must fail each time
        run: |
          cd services/api
          uv run python ../../scripts/defect_detection.py 2>&1 | tee ../../artifacts/tmp/ci-defect-detection.txt

      - name: Every file was put back
        if: always()
        run: git diff --exit-code -- services/api

      - name: Report the result
        if: always()
        run: |
          set +e +o pipefail
          annotate() {
            local title="$1" body
            body=$(head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=${title}::${body}"
          }
          if [ -f artifacts/tmp/ci-defect-detection.txt ]; then
            # Two annotations: one would be cut short by the size limit.
            sed -n '1,14p' artifacts/tmp/ci-defect-detection.txt | cut -c1-120 | annotate "defect detection 1 of 2"
            sed -n '15,$p' artifacts/tmp/ci-defect-detection.txt | cut -c1-120 | annotate "defect detection 2 of 2"
          fi
          if [ ! -s artifacts/tmp/ci-defect-detection.txt ] && [ -f artifacts/tmp/ci-db-up.txt ]; then
            tail -n 30 artifacts/tmp/ci-db-up.txt | cut -c1-200 | annotate "last lines of ci-db-up"
          fi

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: defect-detection
          path: artifacts/tmp/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop the databases
        if: always()
        run: make db-down
