services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  object-storage:
    image: chrislusf/seaweedfs:4.53
    container_name: cortex-object-storage
    entrypoint: ["weed"]
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${CORTEX_S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${CORTEX_S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${CORTEX_S3_BUCKET:-cortex-uploads}
    ports:
      - "8333:8333"
    volumes:
      - object_storage_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend
    environment:
      CORTEX_ENV: dev
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-deterministic}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:-}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-}
      CORTEX_LLM_TIMEOUT_S: ${CORTEX_LLM_TIMEOUT_S:-30}
      CORTEX_LLM_MAX_OUTPUT_TOKENS: ${CORTEX_LLM_MAX_OUTPUT_TOKENS:-2048}
      CORTEX_DB_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/cortex
      CORTEX_REDIS_URL: redis://redis:6379/0
      CORTEX_S3_ENDPOINT: http://object-storage:8333
      CORTEX_S3_BUCKET: cortex-uploads
      CORTEX_S3_REGION: us-east-1
      CORTEX_S3_ACCESS_KEY: minioadmin
      CORTEX_S3_SECRET_KEY: minioadmin
      CORTEX_S3_USE_PATH_STYLE: "true"
      CORTEX_WORKFLO_ROOT: /workflo-sandboxes
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - workflo_sandboxes:/workflo-sandboxes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortex-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: cortex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.0.0
    container_name: cortex-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  object_storage_data:
  prometheus_data:
  grafana_data:
  workflo_sandboxes: