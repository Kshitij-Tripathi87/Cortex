[project]
name = "cortex-backend"
version = "0.2.0"
description = "Cortex â€” Enterprise Evidence Platform (Phase 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",  # default dev DSN is sqlite+aiosqlite (config.py); required to boot
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "testcontainers[postgres]>=4.7.0",
]

[project.scripts]
generate-openapi = "scripts.generate_openapi:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "T20"]
ignore = ["S101", "S104", "S608", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "B017"]
"scripts/*" = ["T20", "S607", "S311"]
"scripts/generate_synthetic_dataset.py" = ["S311"]
"scripts/bootstrap_workspace.py" = ["S311"]
"scripts/check_budgets.py" = ["B007", "W293"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# TYPING RATCHET (added 2026-09, CI-green initiative — see PR #1)
#
# `strict = true` above is the TARGET state for the whole codebase. The
# overrides below are an explicit, machine-generated ratchet: for each
# module they disable exactly the error codes that were already firing
# when the ratchet was introduced (~800 strict-mode errors accumulated
# before CI ever ran).
#
# Contract:
#   * NEW errors of a kind NOT listed for a module still fail CI.
#   * When a module is reworked, DELETE its override — mypy then enforces
#     full strictness for it again.
#   * Overrides must never be extended; only deleted.
# ─────────────────────────────────────────────────────────────────────────────
[[tool.mypy.overrides]]
module = "app.api.v1.agent_runtime"
disable_error_code = ["arg-type"]  # ratchet: delete when reworked

[[tool.mypy.overrides]]
module = "app.api.v1.agents_router"
