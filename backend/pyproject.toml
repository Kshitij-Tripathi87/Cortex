[project]
name = "cortex-backend"
version = "0.2.0"
description = "Cortex â€” Enterprise Evidence Platform (Phase 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "testcontainers[postgres]>=4.7.0",
]

[project.scripts]
generate-openapi = "scripts.generate_openapi:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "T20"]
ignore = ["S101", "S104", "S608", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "B017"]
"scripts/*" = ["T20", "S607", "S311"]
"scripts/generate_synthetic_dataset.py" = ["S311"]
"scripts/bootstrap_workspace.py" = ["S311"]
"scripts/check_budgets.py" = ["B007", "W293"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# By default every test run EXCEPT dedicated stress runs excludes `@pytest.mark.stress`.
# Per ADR-015 Program J J.1: 100k replay-determinism belongs in a dedicated CI
# job (nightly + release-candidate), not on every PR. Add `-m "not stress"` so a
# plain `pytest tests/` invocation stays fast even if the marker is forgotten
# on the command line.
addopts = "-v --tb=short -m 'not stress'"
markers = [
    "deferred: tests for deferred (post-MVP) code under tests/deferred/",
    "stress: long-running regression tests (e.g. 100k-event replay determinism). Excluded from default `pytest` and PR CI; run in the nightly `stress` CI job and on release candidates.",
]

[tool.setuptools]
packages = ["app", "app.common", "app.infrastructure", "app.api", "app.api.v1",
            "app.deferred", "app.deferred.workflow_engine",
            "app.modules", "app.modules.audit", "app.modules.sources",
            "app.modules.inference", "app.modules.compiler", "app.modules.events",
            "app.modules.quality", "app.modules.ontology", "app.modules.performance",
            "app.modules.security", "app.modules.graph", "app.modules.identity",
            "app.modules.access", "app.modules.supply_chain", "app.modules.disruption",
            "app.modules.decision", "app.modules.ingestion"]