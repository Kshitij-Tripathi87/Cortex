services:
  api-a:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment: &backend-env
      CORTEX_ENV: staging
      CORTEX_DB_DSN: ${CORTEX_DB_DSN:?CORTEX_DB_DSN is required}
      CORTEX_REDIS_URL: ${CORTEX_REDIS_URL:?CORTEX_REDIS_URL is required}
      CORTEX_S3_ENDPOINT: ${CORTEX_S3_ENDPOINT:?CORTEX_S3_ENDPOINT is required}
      CORTEX_S3_BUCKET: ${CORTEX_S3_BUCKET:?CORTEX_S3_BUCKET is required}
      CORTEX_S3_REGION: ${CORTEX_S3_REGION:-auto}
      CORTEX_S3_ACCESS_KEY: ${CORTEX_S3_ACCESS_KEY:?CORTEX_S3_ACCESS_KEY is required}
      CORTEX_S3_SECRET_KEY: ${CORTEX_S3_SECRET_KEY:?CORTEX_S3_SECRET_KEY is required}
      CORTEX_S3_USE_PATH_STYLE: ${CORTEX_S3_USE_PATH_STYLE:-false}
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?CORTEX_JWT_SECRET is required}
      # The address the staging site is served from (scheme and host, no
      # path). Browsers let the site call this API only if it is listed here.
      CORTEX_CORS_ALLOWED_ORIGINS: ${CORTEX_CORS_ALLOWED_ORIGINS:?CORTEX_CORS_ALLOWED_ORIGINS is required}
      # Address(es) of the load balancer in front of the API, if any: limits
      # are counted per visitor address.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Staging is validated like production: the API refuses to start, naming
      # the missing variable, unless CORTEX_LLM_API_KEY and CORTEX_LLM_MODEL are
      # set (the built-in assistant is dev/test only). They were not passed to
      # the container before, so it could not start at all.
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:-}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-}
      CORTEX_OUTBOX_PUBLISHER_ENABLED: ${CORTEX_OUTBOX_PUBLISHER_ENABLED:-false}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  api-b:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment: *backend-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  outbox-relay:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      CORTEX_ENV: staging
      CORTEX_DB_DSN: ${CORTEX_DB_DSN:?CORTEX_DB_DSN is required}
      CORTEX_REDIS_URL: ${CORTEX_REDIS_URL:?CORTEX_REDIS_URL is required}
      # The relay loads the same settings, which staging validates in full.
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?CORTEX_JWT_SECRET is required}
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:-}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-}
      CORTEX_OUTBOX_PUBLISHER_ID: ${CORTEX_OUTBOX_PUBLISHER_ID:-staging-outbox-relay}
      CORTEX_OUTBOX_SWEEP_INTERVAL_S: ${CORTEX_OUTBOX_SWEEP_INTERVAL_S:-1.0}
      CORTEX_OUTBOX_BATCH_SIZE: ${CORTEX_OUTBOX_BATCH_SIZE:-100}
    command: python -m app.workers.outbox_relay
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    # No `command`: the image starts its own server (`node server.js`). The
    # image holds Next's standalone output, which has no `next` binary, so
    # the `npm run start` that used to be here could not start.
    restart: unless-stopped

# Staging intentionally contains no PostgreSQL, Redis, Kafka, or MinIO services.
# Use dedicated managed services so staging exercises the persistence and
# failure boundaries expected in production. The multi-agent runtime and
# simulation execution stay behind their existing application entrypoints.
