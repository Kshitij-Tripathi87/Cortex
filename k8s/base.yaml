apiVersion: v1
kind: Namespace
metadata:
  name: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/version: "0.3.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex
data:
  CORTEX_ENV: "prod"
  CORTEX_HOST: "0.0.0.0"
  CORTEX_PORT: "8000"
  CORTEX_DB_DSN: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@cortex-postgres:5432/cortex"
  CORTEX_REDIS_URL: "redis://cortex-redis:6379/0"
  CORTEX_S3_ENDPOINT: "http://cortex-minio:9000"
  CORTEX_S3_BUCKET: "cortex-uploads"
  CORTEX_S3_REGION: "us-east-1"
  CORTEX_S3_USE_PATH_STYLE: "true"
  OTEL_SERVICE_NAME: "cortex-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://cortex-otel:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: cortex-secrets
  namespace: cortex
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual secrets managed by your secret management solution
  # Examples: HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager
  # These placeholder values will be auto-generated by the Helm chart if using Helm
  DB_USER: "cortex"
  DB_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD_USE_SECRET_MANAGEMENT"
  S3_ACCESS_KEY: "REPLACE_WITH_SECURE_KEY_USE_SECRET_MANAGEMENT"
  S3_SECRET_KEY: "REPLACE_WITH_SECURE_SECRET_USE_SECRET_MANAGEMENT"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-backend
  namespace: cortex
  labels:
    app: cortex-backend
    version: "0.3.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cortex-backend
  template:
    metadata:
      labels:
        app: cortex-backend
        version: "0.3.0"
    spec:
      serviceAccountName: cortex-backend
      containers:
        - name: backend
          image: cortex-backend:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # F2: startupProbe gives the readiness check up to
          # ~3 minutes to pass the first time (DB pool warm,
          # Redis ping, audit chain marker). Without it, the
          # readiness probe's 5s initialDelaySeconds can flip
          # the pod NotReady before init_db() has finished,
          # and K8s kills it on the next cycle.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36  # 5s * 36 = 180s = 3m budget
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cortex-backend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-backend
  namespace: cortex
  labels:
    app: cortex-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: cortex-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-frontend
  namespace: cortex
  labels:
    app: cortex-frontend
    version: "0.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex-frontend
  template:
    metadata:
      labels:
        app: cortex-frontend
        version: "0.2.0"
    spec:
      containers:
        - name: frontend
          image: cortex-frontend:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://cortex-backend:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-frontend
  namespace: cortex
  labels:
    app: cortex-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: cortex-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  namespace: cortex
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cortex.example.com
      secretName: cortex-tls
  rules:
    - host: cortex.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cortex-backend
                port:
                  number: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-backend
  namespace: cortex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cortex-backend-role
  namespace: cortex
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cortex-backend-binding
  namespace: cortex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cortex-backend-role
subjects:
  - kind: ServiceAccount
    name: cortex-backend
    namespace: cortex
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortex-backend-pdb
  namespace: cortex
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cortex-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortex-frontend-pdb
  namespace: cortex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cortex-frontend