{{- if .Values.objectStorage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-object-storage
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.objectStorage.persistence.size }}
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-object-storage
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: object-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: object-storage
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seaweedfs
          image: "{{ .Values.objectStorage.image.repository }}:{{ .Values.objectStorage.image.tag }}"
          imagePullPolicy: {{ .Values.objectStorage.image.pullPolicy }}
          command: ["weed"]
          args:
            - mini
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -s3.port={{ .Values.objectStorage.service.port }}
          ports:
            - name: s3
              containerPort: {{ .Values.objectStorage.service.port }}
              protocol: TCP
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cortex.fullname" . }}-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cortex.fullname" . }}-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.bucket | quote }}
          volumeMounts:
            - name: object-storage-data
              mountPath: /data
          resources:
            {{- toYaml .Values.objectStorage.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: object-storage-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-object-storage
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-object-storage
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-storage
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: {{ .Values.objectStorage.service.port }}
      targetPort: s3
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: object-storage
{{- end }}
