apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cortex.fullname" . }}-config
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
data:
  CORTEX_ENV: {{ .Values.config.CORTEX_ENV | quote }}
  CORTEX_HOST: {{ .Values.config.CORTEX_HOST | quote }}
  CORTEX_PORT: {{ .Values.config.CORTEX_PORT | quote }}
  CORTEX_DB_DSN: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@{{ .Release.Name }}-postgresql:5432/cortex"
  CORTEX_REDIS_URL: "redis://{{ .Release.Name }}-redis-master:6379/0"
  CORTEX_S3_ENDPOINT: "http://{{ .Release.Name }}-minio:9000"
  CORTEX_S3_BUCKET: "cortex-uploads"
  CORTEX_S3_REGION: "us-east-1"
  CORTEX_S3_USE_PATH_STYLE: "true"
  OTEL_SERVICE_NAME: {{ .Values.config.OTEL_SERVICE_NAME | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cortex.fullname" . }}-secrets
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: "cortex"
  DB_PASSWORD: {{ .Values.secrets.dbPassword | default (randAlphaNum 32) | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | default (randAlphaNum 20) | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | default (randAlphaNum 32) | quote }}