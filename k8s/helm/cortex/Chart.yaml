apiVersion: v2
name: cortex
description: Cortex — Enterprise Evidence Platform Helm Chart
type: application
version: 0.3.0
appVersion: "0.3.0"
keywords:
  - evidence
  - supply-chain
  - graph
  - ml
  - decision-memory
maintainers:
  - name: Cortex Team
    email: cortex@example.com
dependencies:
  - name: postgresql
    version: "12.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: minio
    version: "11.x"
    repository: "https://charts.min.io/"
    condition: minio.enabled