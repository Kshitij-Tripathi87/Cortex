repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, sqlalchemy, fastapi, pydantic-settings]
        args: [--strict]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.80.0
    hooks:
      - id: trufflehog
        args: [--no-verification]

  - repo: local
    hooks:
      - id: pytest-unit
        name: Unit Tests
        entry: pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true