services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. PostgreSQL 16 (Durable Source of Truth)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cortex-postgres-prod
    environment:
      POSTGRES_USER: ${CORTEX_DB_USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD in the deployment environment}
      POSTGRES_DB: ${CORTEX_DB_NAME:-cortex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Redis 7.2 (Low-Latency Cache, Coordination & Distributed Locks)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: cortex-redis-prod
    command: redis-server --appendonly yes --requirepass ${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Apache Kafka (KRaft mode — High-Throughput Event & Message Backbone)
  # ─────────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: cortex-kafka-prod
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. S3-Compatible Object Storage (SeaweedFS)
  # ─────────────────────────────────────────────────────────────────────────────
  object-storage:
    image: chrislusf/seaweedfs:4.53
    container_name: cortex-object-storage-prod
    entrypoint: ["weed"]
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${CORTEX_S3_ACCESS_KEY:?Set CORTEX_S3_ACCESS_KEY in the deployment environment}
      AWS_SECRET_ACCESS_KEY: ${CORTEX_S3_SECRET_KEY:?Set CORTEX_S3_SECRET_KEY in the deployment environment}
      S3_BUCKET: ${CORTEX_S3_BUCKET:-cortex-uploads}
    ports:
      - "8333:8333"
    volumes:
      - object_storage_data:/data
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Cortex Backend API Instance A (Control Plane & Inference Gateway)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-api-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend-api-a
    environment:
      CORTEX_ENV: prod
      CORTEX_OUTBOX_PUBLISHER_ENABLED: "false"
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD in the deployment environment}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORTEX_S3_ENDPOINT: http://object-storage:8333
      CORTEX_S3_ACCESS_KEY: ${CORTEX_S3_ACCESS_KEY:?Set CORTEX_S3_ACCESS_KEY in the deployment environment}
      CORTEX_S3_SECRET_KEY: ${CORTEX_S3_SECRET_KEY:?Set CORTEX_S3_SECRET_KEY in the deployment environment}
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?Set CORTEX_JWT_SECRET in the deployment environment}
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:?Set CORTEX_LLM_API_KEY in the deployment environment}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:?Set CORTEX_LLM_MODEL in the deployment environment}
      CORTEX_LLM_TIMEOUT_S: ${CORTEX_LLM_TIMEOUT_S:-30}
      CORTEX_LLM_MAX_OUTPUT_TOKENS: ${CORTEX_LLM_MAX_OUTPUT_TOKENS:-2048}
      NODE_NAME: api-node-alpha
    ports:
      - "8000:8000"
    depends_on:
      object-storage:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Cortex Backend API Instance B (High-Availability Clustered Node)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-api-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend-api-b
    environment:
      CORTEX_ENV: prod
      CORTEX_OUTBOX_PUBLISHER_ENABLED: "false"
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD in the deployment environment}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORTEX_S3_ENDPOINT: http://object-storage:8333
      CORTEX_S3_ACCESS_KEY: ${CORTEX_S3_ACCESS_KEY:?Set CORTEX_S3_ACCESS_KEY in the deployment environment}
      CORTEX_S3_SECRET_KEY: ${CORTEX_S3_SECRET_KEY:?Set CORTEX_S3_SECRET_KEY in the deployment environment}
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?Set CORTEX_JWT_SECRET in the deployment environment}
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:?Set CORTEX_LLM_API_KEY in the deployment environment}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:?Set CORTEX_LLM_MODEL in the deployment environment}
      CORTEX_LLM_TIMEOUT_S: ${CORTEX_LLM_TIMEOUT_S:-30}
      CORTEX_LLM_MAX_OUTPUT_TOKENS: ${CORTEX_LLM_MAX_OUTPUT_TOKENS:-2048}
      NODE_NAME: api-node-beta
    ports:
      - "8002:8000"
    depends_on:
      object-storage:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Cortex Agent Swarm Runtime & Execution Worker
  # ─────────────────────────────────────────────────────────────────────────────
  agent-runtime:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-agent-runtime-prod
    command: python -m app.modules.multi_agent.runtime_worker
    environment:
      CORTEX_ENV: prod
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?Set CORTEX_JWT_SECRET in the deployment environment}
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:?Set CORTEX_LLM_API_KEY in the deployment environment}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:?Set CORTEX_LLM_MODEL in the deployment environment}
      CORTEX_LLM_TIMEOUT_S: ${CORTEX_LLM_TIMEOUT_S:-30}
      CORTEX_LLM_MAX_OUTPUT_TOKENS: ${CORTEX_LLM_MAX_OUTPUT_TOKENS:-2048}
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD in the deployment environment}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 7b. Cortex Outbox Relay Worker (v0.8.5-B4 — durable outbox → Redis → SSE/WS)
  #
  # Dedicated relay process for deployments that want delivery isolated from
  # API replicas. Safe to scale (SKIP LOCKED + per-workspace exclusion +
  # leases); safe to omit (the API runs the same sweeper in-process unless
  # CORTEX_OUTBOX_PUBLISHER_ENABLED=false). Needs DB + Redis only.
  # ─────────────────────────────────────────────────────────────────────────────
  outbox-relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-outbox-relay-prod
    command: python -m app.workers.outbox_relay
    environment:
      CORTEX_ENV: prod
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?Set CORTEX_JWT_SECRET in the deployment environment}
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:?Set CORTEX_LLM_API_KEY in the deployment environment}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:?Set CORTEX_LLM_MODEL in the deployment environment}
      CORTEX_LLM_TIMEOUT_S: ${CORTEX_LLM_TIMEOUT_S:-30}
      CORTEX_LLM_MAX_OUTPUT_TOKENS: ${CORTEX_LLM_MAX_OUTPUT_TOKENS:-2048}
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD in the deployment environment}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}@redis:6379/0
      CORTEX_OUTBOX_PUBLISHER_ID: ${CORTEX_OUTBOX_PUBLISHER_ID:-outbox-relay-prod}
      CORTEX_OUTBOX_SWEEP_INTERVAL_S: ${CORTEX_OUTBOX_SWEEP_INTERVAL_S:-1.0}
      CORTEX_OUTBOX_BATCH_SIZE: ${CORTEX_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. Cortex Digital Twin & Simulation Worker
  # ─────────────────────────────────────────────────────────────────────────────
  simulation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-simulation-worker-prod
    command: python -m app.modules.digital_twin.simulation_worker
    environment:
      CORTEX_ENV: prod
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:?Set CORTEX_JWT_SECRET in the deployment environment}
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-openai_compatible}
      CORTEX_LLM_API_KEY: ${CORTEX_LLM_API_KEY:?Set CORTEX_LLM_API_KEY in the deployment environment}
      CORTEX_LLM_BASE_URL: ${CORTEX_LLM_BASE_URL:-https://api.openai.com/v1}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:?Set CORTEX_LLM_MODEL in the deployment environment}
      CORTEX_LLM_TIMEOUT_S: ${CORTEX_LLM_TIMEOUT_S:-30}
      CORTEX_LLM_MAX_OUTPUT_TOKENS: ${CORTEX_LLM_MAX_OUTPUT_TOKENS:-2048}
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:?Set CORTEX_DB_PASSWORD in the deployment environment}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:?Set CORTEX_REDIS_PASSWORD in the deployment environment}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. Cortex Next.js Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public API origin}
    container_name: cortex-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public API origin}
    ports:
      - "3000:3000"
    depends_on:
      - backend-api-a
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  object_storage_data:

