services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. PostgreSQL 16 (Durable Source of Truth)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cortex-postgres-prod
    environment:
      POSTGRES_USER: ${CORTEX_DB_USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_DB_PASSWORD:-cortex_secure_prod_2026!}
      POSTGRES_DB: ${CORTEX_DB_NAME:-cortex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Redis 7.2 (Low-Latency Cache, Coordination & Distributed Locks)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: cortex-redis-prod
    command: redis-server --appendonly yes --requirepass ${CORTEX_REDIS_PASSWORD:-cortex_redis_secure_2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CORTEX_REDIS_PASSWORD:-cortex_redis_secure_2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Apache Kafka (KRaft mode — High-Throughput Event & Message Backbone)
  # ─────────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: cortex-kafka-prod
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. MinIO Object Storage (Datasets, Models & Scenario Artifacts)
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: cortex-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CORTEX_S3_ACCESS_KEY:-cortex_minio_admin}
      MINIO_ROOT_PASSWORD: ${CORTEX_S3_SECRET_KEY:-cortex_minio_secret_2026!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Cortex Backend API Instance A (Control Plane & Inference Gateway)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-api-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend-api-a
    environment:
      CORTEX_ENV: prod
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:-cortex_secure_prod_2026!}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:-cortex_redis_secure_2026!}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORTEX_S3_ENDPOINT: http://minio:9000
      CORTEX_S3_ACCESS_KEY: ${CORTEX_S3_ACCESS_KEY:-cortex_minio_admin}
      CORTEX_S3_SECRET_KEY: ${CORTEX_S3_SECRET_KEY:-cortex_minio_secret_2026!}
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:-cortex_production_jwt_master_secret_2026_enterprise}
      NODE_NAME: api-node-alpha
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Cortex Backend API Instance B (High-Availability Clustered Node)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-api-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend-api-b
    environment:
      CORTEX_ENV: prod
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:-cortex_secure_prod_2026!}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:-cortex_redis_secure_2026!}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORTEX_S3_ENDPOINT: http://minio:9000
      CORTEX_S3_ACCESS_KEY: ${CORTEX_S3_ACCESS_KEY:-cortex_minio_admin}
      CORTEX_S3_SECRET_KEY: ${CORTEX_S3_SECRET_KEY:-cortex_minio_secret_2026!}
      CORTEX_JWT_SECRET: ${CORTEX_JWT_SECRET:-cortex_production_jwt_master_secret_2026_enterprise}
      NODE_NAME: api-node-beta
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Cortex Agent Swarm Runtime & Execution Worker
  # ─────────────────────────────────────────────────────────────────────────────
  agent-runtime:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-agent-runtime-prod
    command: python -m app.modules.multi_agent.runtime_worker
    environment:
      CORTEX_ENV: prod
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:-cortex_secure_prod_2026!}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:-cortex_redis_secure_2026!}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. Cortex Digital Twin & Simulation Worker
  # ─────────────────────────────────────────────────────────────────────────────
  simulation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-simulation-worker-prod
    command: python -m app.modules.digital_twin.simulation_worker
    environment:
      CORTEX_ENV: prod
      CORTEX_DB_DSN: postgresql+asyncpg://${CORTEX_DB_USER:-cortex}:${CORTEX_DB_PASSWORD:-cortex_secure_prod_2026!}@postgres:5432/${CORTEX_DB_NAME:-cortex}
      CORTEX_REDIS_URL: redis://:${CORTEX_REDIS_PASSWORD:-cortex_redis_secure_2026!}@redis:6379/0
      CORTEX_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. Cortex Next.js Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortex-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend-api-a
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:

